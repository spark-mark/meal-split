<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meal Split</title>
<meta name="description" content="Split a restaurant order into meal-allowance checks that stay under the USD caps.">
<meta name="theme-color" content="#fbf7ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b130d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meal Split">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<link rel="stylesheet" href="/vendor/drawably/style.css">
<style>\n:root {{ padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }}\nbody {{ margin: 0; }}\n[hidden] {{ display: none !important; }}
/* Layout: one narrow phone column, two steps (order + budgets, then checks); header (back · step · settings), scrolling body, sticky footer.
   Fine stationery: dark-brown ink on cream paper, thin hand-ruled lines from Drawably that fade in patches (ink.png), a faint grain from paper.png. */
:root {
  --bg: #fbf7ec;
  --fg: #2a1c13;
  --fg2: #7a6553;
  --fg3: #b2a38c;
  --fill: #f3ecdc;
  --line: #e7dec9;
  --track: #ece3d0;
  --hold: rgba(42,28,19,.10);
  --knob: #fffdf7;
  --scrim: rgba(30,19,11,.32);
  --lift: rgba(42,28,19,.16);
  --r: 0;
  --font: "Newsreader", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --drawably-stroke: var(--fg);
  --drawably-fill: var(--fg);
  --drawably-paper: var(--bg);
  --drawably-width: .8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b130d; --fg: #f7f0de; --fg2: #a8937d; --fg3: #6c5947; --fill: #261b13; --line: #36281c;
    --track: #33261b; --hold: rgba(247,240,222,.14); --knob: #d8cab5; --scrim: rgba(0,0,0,.6);
    --lift: rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b130d; --fg: #f7f0de; --fg2: #a8937d; --fg3: #6c5947; --fill: #261b13; --line: #36281c;
  --track: #33261b; --hold: rgba(247,240,222,.14); --knob: #d8cab5; --scrim: rgba(0,0,0,.6);
  --lift: rgba(0,0,0,.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 17px; line-height: 1.3;
  -webkit-font-smoothing: antialiased; font-variant-numeric: lining-nums tabular-nums;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform .12s ease-out, opacity .12s ease-out; }
button:active:not(:disabled):not(.hold) { transform: scale(.97); }
.name:active, .price:active, .linkbtn:active, .iconbtn:active { transform: none !important; opacity: .55; }
:focus-visible { outline: 1.5px solid var(--fg); outline-offset: 2px; }

.app {
  max-width: 480px; margin: 0 auto; min-height: 100%;
  display: flex; flex-direction: column;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
}
.step { display: flex; flex-direction: column; flex: 1; }
.head { padding-block: 24px 0; display: flex; flex-direction: column; gap: 24px; }
.navrow { display: flex; align-items: center; gap: 4px; margin-left: -12px; margin-right: -12px; }
.navrow .label { flex: 1; font-size: 15px; color: var(--fg2); }
.navrow.flush { margin-left: 0; }
.iconbtn { width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; display: grid; place-items: center; flex: none; padding: 0; color: var(--fg); }
.iconbtn svg { width: 22px; height: 22px; }
.iconbtn.gear { color: var(--fg2); }
.bars { display: flex; gap: 6px; margin-top: 10px; }
.bars i { flex: 1; height: 3px; border-radius: 2px; background: var(--track); transform-origin: left; }
.bars i.on { background: var(--fg); }
h4 { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; text-wrap: balance; }
.body { padding-block: 24px 16px; display: flex; flex-direction: column; gap: 24px; flex: 1; }
.foot {
  position: sticky; bottom: 0; background: var(--bg);
  padding-top: 12px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 12px;
}
.primary { height: 52px; border: 0; border-radius: var(--r); background: var(--fg); color: var(--bg); font-size: 17px; font-weight: 600; width: 100%; }
.primary:disabled { opacity: .25; cursor: default; }
.hold { position: relative; overflow: hidden; width: 100%; height: 52px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); color: var(--fg); font-size: 17px; font-weight: 500; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
.hold .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--hold); }
.hold .txt { position: relative; }
.linkbtn { border: 0; background: transparent; padding: 0; color: var(--fg); font-size: 17px; font-weight: 500; min-height: 44px; }

/* step 1 */
.items { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); }
.item.sel { border: 1.5px solid var(--fg); margin: -0.5px; }
.item .name { flex: 1; min-width: 0; min-height: 56px; border: 0; background: transparent; padding: 12px 0 12px 16px; display: flex; align-items: center; text-align: left; font-size: 17px; overflow: hidden; }
.item .name > span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .qty, .item .price { flex: none; }
.item .name .q { color: var(--fg3); margin-right: 4px; }
.item .qty { display: flex; gap: 6px; padding-left: 8px; }
.item .qty button { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 16px; background: var(--bg); font-size: 18px; line-height: 1; display: grid; place-items: center; padding: 0; }
.item .price { align-self: stretch; border: 0; background: transparent; padding: 12px 16px 12px 12px; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; }
.item .price span { font-size: 17px; }
.item .price small { font-size: 12px; color: var(--fg3); }
.additem { width: 100%; min-height: 52px; border: 1px dashed var(--line); border-radius: var(--r); background: var(--bg); font-size: 17px; font-weight: 500; color: var(--fg2); }
.example { font-size: 15px; color: var(--fg2); display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.example .linkbtn { font-size: 15px; min-height: 32px; text-decoration: underline; text-underline-offset: 3px; }

.budgets { display: flex; flex-direction: column; gap: 12px; }
.sum-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 15px; }
.sum-top .status { font-weight: 600; color: var(--fg); min-width: 0; }
.sum-top .status.idle { color: var(--fg2); font-weight: 400; }
.sum-top .total { color: var(--fg2); white-space: nowrap; }
.person { display: flex; flex-direction: column; gap: 6px; }
.person .who { font-size: 13px; color: var(--fg2); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile {
  position: relative; overflow: hidden; height: 64px; border-radius: var(--r); border: 1px solid var(--line); background: var(--bg); color: var(--fg2);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0;
}
.tile i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--hold); }
.tile b, .tile small { position: relative; }
.tile b { font-size: 15px; font-weight: 400; }
.tile small { font-size: 13px; }
.tile[aria-pressed="false"] { border-style: dashed; color: var(--fg3); }
.tile.live { border: 1.5px solid var(--fg); color: var(--fg); }
.tile.live b { font-weight: 600; }

/* step 2 */
.note { font-size: 13px; color: var(--fg2); margin: 0; }

/* sheets */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: flex; flex-direction: column; justify-content: flex-end; z-index: 20; }
.sheet {
  background: var(--bg); width: 100%; max-width: 480px; margin: 0 auto;
  padding-top: 10px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px; max-height: 90%; overflow-y: auto;
}
/* add/edit item: the form floats in the free space, the budgets dock to the bottom edge */
.scrim.split { overflow-x: hidden; overflow-y: auto; padding-top: calc(env(safe-area-inset-top, 0px) + 12px); }
.scrim.out { pointer-events: none; }
body:has(.scrim.split:not(.out)) .foot { visibility: hidden; }
.card {
  background: var(--bg); flex: none; width: calc(100% - 32px); max-width: 448px; margin: auto;
  padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 18px;
}
.dock {
  background: var(--bg); flex: none; width: 100%; max-width: 480px; margin: 12px auto 0;
  padding-top: 20px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
}
/* keyboard open: the home-indicator inset sits behind the keyboard, so give that space back */
.scrim.kb .card { padding: 8px 20px 16px; gap: 10px; }
.scrim.kb .dock { padding-top: 14px; padding-bottom: 14px; }
.scrim.kb .tile { height: 56px; }
.grab { align-self: center; width: 36px; height: 4px; border-radius: 2px; background: var(--line); flex: none; }
.sheet-bar { display: flex; justify-content: space-between; align-items: center; }
.sheet-bar h2 { margin: 0; font-size: 17px; font-weight: 600; }
.sheet-bar .linkbtn { font-weight: 400; color: var(--fg2); }
.sheet-bar .strong { font-weight: 600; color: var(--fg); }
.group { display: flex; flex-direction: column; background: var(--fill); border-radius: var(--r); margin: 0; }
.field { display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 52px; position: relative; }
.field + .field::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--line); }
.field > span:first-child { flex: 1; font-size: 17px; }
.field.fixed > span:first-child { flex: none; width: 64px; }
.field input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 17px; }
.field input::placeholder { color: var(--fg3); }
.field input.right { flex: none; width: 84px; text-align: right; }
.field .unit { color: var(--fg2); }
.group-note { font-size: 13px; color: var(--fg2); margin: -10px 16px 0; }
.group-note a, .group-note .inline { color: var(--fg); text-decoration: underline; text-underline-offset: 2px; }
.group-note .inline { border: 0; background: none; padding: 0; font-size: inherit; }
.danger { border: 1px solid var(--line); background: var(--bg); border-radius: var(--r); min-height: 52px; color: var(--fg); font-size: 17px; width: 100%; }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); font-size: 15px; padding: 8px 16px; z-index: 30; }

/* paper layer: Drawably draws the lines, so boxes drop their own borders and fills; the grain sits over everything but takes no taps */
.drawably-button, .drawably-card { font-family: inherit; }
/* ink.png lets a line run light in patches; each box offsets it by its seed so no two fade alike */
.drawably-svg { -webkit-mask: url(/ink.png) var(--ink, 0 0) / 340px; mask: url(/ink.png) var(--ink, 0 0) / 340px; }
.primary .drawably-svg, .ck .drawably-svg { -webkit-mask: none; mask: none; }
.ck { flex: none; }
body::after { content: ""; position: fixed; inset: 0; z-index: 40; pointer-events: none; background: url(/paper.png) 0 0 / 256px; }
h4, h4.drawably-host { font-size: 28px; font-weight: 500; line-height: 1.15; letter-spacing: -.012em; }
.navrow .label, .example, .group-note { font-style: italic; }
.bars i, .bars i.on { flex: 1; height: 8px; margin: 0; background: none; border-radius: 0; }

.item { border: 0; background: none; padding: 0; }
.item.sel { border: 0; margin: 0; }
.item .qty button { border: 0; background: none; }
.additem { border: 0; background: none; font-weight: 400; font-style: italic; }

.tile { border: 0; background: none; }
.tile b { font-size: 16px; line-height: 1.2; }
.tile small { font-size: 13.5px; line-height: 1.2; }
.tile i { left: 4px; top: 4px; bottom: 4px; max-width: calc(100% - 8px); background: var(--fill); overflow: hidden; }
.tile[aria-pressed="false"], .tile.live { border: 0; }
.tile[aria-pressed="false"] small { font-style: italic; }
.tile.live b { font-weight: 500; }

.sum-top .status { font-size: 18px; font-weight: 500; }
.sum-top .status.idle { font-style: italic; }
.item .name .q, .item .price small { color: var(--fg2); }
.primary { background: none; font-size: 18px; font-weight: 500; letter-spacing: .01em; }
.hold, .danger { border: 0; background: none; font-size: 16px; }
.sheet-bar h2 { font-weight: 500; }

/* the checks print as one slip: torn top and bottom, always cream, even on the dark theme */
.slip { filter: drop-shadow(0 8px 14px var(--lift)); }
.receipt {
  --fg: #2a1c13; --fg2: #6f5c4b;
  background: #fffdf6; color: var(--fg); padding: 30px 22px; font-family: var(--mono); font-size: 13.5px; line-height: 1.55; letter-spacing: -.01em;
  -webkit-mask: conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / 14px 51% repeat-x, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 14px 51% repeat-x;
  mask: conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / 14px 51% repeat-x, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 14px 51% repeat-x;
}
.r-head { text-align: center; padding-bottom: 14px; }
.r-head b { display: block; font-family: var(--font); font-size: 23px; font-weight: 500; letter-spacing: 0; line-height: 1.2; }
.r-head span { color: var(--fg2); font-size: 12px; }
.r-part { border-top: 1px dashed var(--fg2); padding-block: 14px; }
.r-row { display: flex; justify-content: space-between; gap: 16px; }
.r-row > :last-child { flex: none; }
.r-title { font-weight: 500; margin-bottom: 8px; opacity: .5; }
.r-part ul { margin: 0; padding: 0; list-style: none; font-size: 16px; line-height: 1.5; }
.r-part li small { display: block; font-size: 11.5px; color: var(--fg2); }
.r-total { font-size: 16px; font-weight: 500; margin-top: 8px; }
.r-sum .r-row:last-child { font-weight: 500; }

.card { box-shadow: 0 14px 40px var(--lift); }
.dock { box-shadow: 0 -10px 30px var(--lift); }
.group { background: none; padding: 0; }
.field { padding-block: 8px; }
.field + .field::before { background: var(--line); }

@media (prefers-reduced-motion: reduce) {
  button { transition: none; }
  button:active:not(:disabled):not(.hold) { transform: none; }
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script type="module">
import { drawablyButton, drawablyCard, drawablyCheckbox, drawablyDivider } from "/vendor/drawably/index.js";

const RATE_DEFAULT = 0.7155;           // Wise mid-market, Nov 1 2026
const RATE_DATE = "Nov 1, 2026";
const KEY = "meal-split-v2";
const KINDS = [["breakfast", "Breakfast"], ["lunch", "Lunch"], ["dinner", "Dinner"]];
const uid = () => Math.random().toString(36).slice(2, 9);

const EXAMPLE = () => ({
  example: true,
  people: [{ id: uid(), name: "Me", breakfast: true, lunch: true, dinner: true }],
  items: [
    { id: uid(), name: "Steak frites", price: 38, qty: 1 },
    { id: uid(), name: "Caesar salad", price: 16.5, qty: 1 },
    { id: uid(), name: "Fries", price: 8, qty: 2 },
    { id: uid(), name: "Lemonade", price: 6.5, qty: 2 },
    { id: uid(), name: "Cheesecake", price: 13, qty: 1 }
  ],
  rate: String(RATE_DEFAULT), margin: "0",
  caps: { breakfast: "20", lunch: "30", dinner: "50" },
  split: false
});

let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
if (!S || !Array.isArray(S.people) || !Array.isArray(S.items) || !S.caps) S = EXAMPLE();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
if (!S.rateMode) S.rateMode = "auto";

const ui = { selected: null, sheet: null, draft: { name: "", price: "" } };

const $ = id => document.getElementById(id);
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.]/g, "")); return isFinite(n) ? n : NaN; };
const rate = () => { const r = num(S.rate); return r > 0 ? r : RATE_DEFAULT; };
const cad = c => "$" + (c / 100).toFixed(2);
const usd = c => "US$" + (c / 100 * rate()).toFixed(2);
const usdShort = v => "$" + (Number.isInteger(v) ? v : v.toFixed(2));
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const cap = k => Math.max(0, num(S.caps[k]) || 0);
const ICON = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'
};

/* ---------- solver ---------- */
function allowances() {
  const multi = S.people.length > 1, out = [];
  S.people.forEach((p, i) => {
    const who = p.name.trim() || "Person " + (i + 1);
    KINDS.forEach(([k, label]) => { if (p[k] && cap(k) > 0) out.push({ pid: p.id, kind: k, label: multi ? who + " · " + label : label, capUSD: cap(k) }); });
  });
  return out;
}
function solve(items = S.items) {
  const r = rate(), margin = Math.max(0, num(S.margin) || 0);
  const bins = allowances().map(b => Object.assign(b, {
    cap: Math.max(0, Math.floor(((b.capUSD - margin) / r) * 100 + 1e-6)), entries: [], load: 0
  }));
  bins.sort((a, b) => a.cap - b.cap);
  const units = [];
  items.forEach(it => {
    const c = Math.round(it.price * 100);
    if (c > 0) for (let q = 0; q < it.qty; q++) units.push({ item: it, cents: c });
  });
  units.sort((a, b) => b.cents - a.cents);
  const n = units.length, total = units.reduce((s, u) => s + u.cents, 0);
  const suffix = new Array(n + 1).fill(0);
  for (let i = n - 1; i >= 0; i--) suffix[i] = suffix[i + 1] + units[i].cents;
  const loads = bins.map(() => 0), counts = bins.map(() => 0), assign = new Array(n).fill(-1);
  let best = { covered: -1, used: Infinity, assign: assign.slice() }, nodes = 0, capped = false;
  (function dfs(i, covered, used) {
    if (++nodes > 400000) { capped = true; return; }
    const ub = covered + suffix[i];
    if (ub < best.covered || (ub === best.covered && used >= best.used)) return;
    if (i === n) { best = { covered, used, assign: assign.slice() }; return; }
    const c = units[i].cents, tried = new Set();
    for (let b = 0; b < bins.length; b++) {
      if (loads[b] + c > bins[b].cap) continue;
      const k = bins[b].cap + "|" + loads[b];
      if (tried.has(k)) continue; tried.add(k);
      /* opening a check costs its USD cap, so the smallest budgets win; +1 breaks ties toward fewer checks */
      const fresh = counts[b] === 0 ? Math.round(bins[b].capUSD * 100) * 1000 + 1 : 0;
      loads[b] += c; counts[b]++; assign[i] = b;
      dfs(i + 1, covered + c, used + fresh);
      loads[b] -= c; counts[b]--;
      if (capped) break;
    }
    assign[i] = -1;
    if (!capped) dfs(i + 1, covered, used);
  })(0, 0, 0);
  const self = [];
  units.forEach((u, i) => {
    const b = best.assign[i], e = { item: u.item, cents: u.cents, of: u.cents };
    if (b >= 0) { bins[b].entries.push(e); bins[b].load += u.cents; } else self.push(e);
  });
  if (S.split && self.length) {
    self.splice(0).forEach(u => {
      let amt = u.cents;
      while (amt > 0) {
        const open = bins.filter(b => b.cap > b.load);
        if (!open.length) break;
        const b = open.find(x => x.load) || open.find(x => x.cap >= amt) || open[open.length - 1];
        const take = Math.min(b.cap - b.load, amt);
        b.entries.push({ item: u.item, cents: take, of: u.cents }); b.load += take; amt -= take;
      }
      if (amt > 0) self.push({ item: u.item, cents: amt, of: u.cents });
    });
  }
  const used = bins.filter(b => b.entries.length);
  return {
    bins, used, self, total, units: n, capped,
    outOfPocket: self.reduce((s, u) => s + u.cents, 0),
    leftover: used.reduce((s, b) => s + (b.cap - b.load), 0),
    availUSD: bins.reduce((s, b) => s + b.capUSD, 0)
  };
}
function lines(entries) {
  const m = new Map();
  entries.forEach(e => {
    const part = e.cents < e.of, k = e.item.id + (part ? "|" + e.cents : "");
    const g = m.get(k) || { name: e.item.name, n: 0, cents: 0, part, of: e.of };
    g.n++; g.cents += e.cents; m.set(k, g);
  });
  return [...m.values()];
}
const lineText = g => (g.n > 1 ? g.n + " " : "") + g.name;

/* ---------- views ---------- */
const STEPS = ["order", "checks"];
const step = () => { const h = location.hash.slice(1); return STEPS.includes(h) ? h : "order"; };
function go(s) {
  ui.selected = null;
  if (s === "order") { if (location.hash) location.hash = ""; }
  else location.hash = s;
  render(); window.scrollTo(0, 0);
}

function header(n, back) {
  return `<div class="head"><div>
    <div class="navrow ${back ? "" : "flush"}">
      ${back ? `<button class="iconbtn" type="button" data-act="go" data-to="${back}" aria-label="Back">${ICON.back}</button>` : ""}

}

/* the items the budgets should reflect right now, including a price still being typed in the sheet */
function previewItems() {
  const pr = num(ui.draft.price);
  if (ui.sheet === "edit") return S.items.map(it => it.id === ui.editId && pr > 0 ? { ...it, price: pr } : it);
  if (ui.sheet === "add" && pr > 0) return [...S.items, { id: "draft", name: "", price: pr, qty: 1 }];
  return S.items;
}

function budgets(R) {
  const multi = S.people.length > 1;
  let status, cls = "";
  if (!R.bins.length) { status = "Pick a budget"; cls = "idle"; }
  else if (!R.units) { status = "No items yet"; cls = "idle"; }
  else if (R.outOfPocket) status = `You pay ${cad(R.outOfPocket)}`;
  else if (multi) status = `Fits in ${R.used.length} check${R.used.length === 1 ? "" : "s"}`;
  else status = "Uses " + R.used.map(b => b.label).join(" + ");
  const coveredUSD = (R.total - R.outOfPocket) / 100 * rate();
  return `<div class="budgets">
    <div class="sum-top"><span class="status ${cls}">${esc(status)}</span><span class="total">US$${coveredUSD.toFixed(2)}</span></div>
    ${S.people.map((p, i) => `<div class="person" data-pid="${p.id}">
      ${multi ? `<span class="who">${esc(p.name.trim() || "Person " + (i + 1))}</span>` : ""}
      <div class="tiles">${KINDS.map(([k, label]) => {
        const b = R.bins.find(x => x.pid === p.id && x.kind === k), load = b ? b.load : 0;
        const used = load / 100 * rate(), pct = load ? Math.min(100, used / b.capUSD * 100) : 0;
        return `<button class="tile ${load ? "live" : ""}" type="button" data-act="tile" data-kind="${k}" aria-pressed="${!!p[k]}">
          <i style="width:${pct}%"></i><b>${label}</b><small>${load ? `$${used.toFixed(2)} / ${cap(k)}` : p[k] ? usdShort(cap(k)) : "Off"}</small>
        </button>`;
      }).join("")}</div>
    </div>`).join("")}
  </div>`;
}

function viewOrder() {

  const R = solve(), now = new Date();

  const checks = R.used.map((b, i) => part(`Check ${i + 1}`, esc(b.label), b.entries, b.load)).join("");

/* fades run on elements that outlive a re-render, so a tap or keystroke never replays them */
const calm = matchMedia("(prefers-reduced-motion: reduce)");
function fade(el) {
  return el.animate({ opacity: [0, 1] }, { duration: calm.matches ? 0 : 180, easing: "ease-out" });
}
function fadeOut(el, done) {
  const a = el.animate({ opacity: [1, 0] }, { duration: calm.matches ? 0 : 140, easing: "ease-in", fill: "forwards" });
  a.finished.then(() => { done(); a.cancel(); }).catch(() => {});
  return a;
}

/* views are rebuilt on every change, so CSS transitions can't run: note what's on screen, then animate from it */
const tileKey = t => t.closest("[data-pid]").dataset.pid + t.dataset.kind;
/* a sketch's look comes from its seed, so seed from what the element is and a rebuild redraws the same strokes */
const seedOf = key => [...String(key)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
function draw(root) {
  const each = (sel, attach, opts = () => ({})) => root.querySelectorAll(sel).forEach((el, i) => {
    const key = el.dataset.kind ? tileKey(el) : (el.closest("[data-iid]")?.dataset.iid || "") + sel + i;
    const seed = seedOf(key);
    el.style.setProperty("--ink", `${seed % 340}px ${(seed >>> 9) % 340}px`);
    attach(el, { seed, roughness: .32, radius: 0, boil: 0, ...opts(el) });
  });
  each(".primary", drawablyButton, () => ({ variant: "solid" }));
  each(".hold, .danger", drawablyButton);
  each(".additem", drawablyButton, () => ({ stroke: "var(--fg2)" }));
  each(".item .qty button", drawablyButton);
  each(".tile", drawablyButton, t => {
    const live = t.classList.contains("live"), on = t.getAttribute("aria-pressed") === "true";
    return { stroke: live ? "var(--fg)" : on ? "var(--fg2)" : "var(--line)", width: live ? 1.5 : .8 };
  });
  each(".item", drawablyCard, r => { const sel = r.classList.contains("sel"); return { width: sel ? 1.5 : .8, stroke: sel ? "var(--fg)" : "var(--fg2)" }; });
  each(".group, .card", drawablyCard);
  each(".bars i", drawablyDivider, b => ({ width: 1.2, stroke: b.classList.contains("on") ? "var(--fg)" : "var(--line)" }));
  each(".ck", drawablyCheckbox);
}
function snap(root) {
  const m = new Map();
  if (!root) return m;
  root.querySelectorAll(".tile").forEach(t => {
    const i = t.querySelector("i");
    m.set(tileKey(t), { px: i.offsetWidth + "px", pct: i.style.width, state: t.className + t.getAttribute("aria-pressed"), color: getComputedStyle(t).color });
  });
  root.querySelectorAll(".item").forEach(r => m.set(r.dataset.iid, r.classList.contains("sel")));
  return m;
}
function play(root, was) {
  const soft = { duration: calm.matches ? 0 : 260, easing: "cubic-bezier(.2,.8,.2,1)" };
  root.querySelectorAll(".tile").forEach(t => {
    const p = was.get(tileKey(t)), i = t.querySelector("i");
    if (!p) return;
    if (i.style.width !== p.pct) i.animate({ width: [p.px, i.style.width] }, soft);
    if (t.className + t.getAttribute("aria-pressed") !== p.state) {
      t.animate({ color: [p.color, getComputedStyle(t).color], transform: ["scale(.97)", "scale(1)"] }, soft);
    }
  });
  root.querySelectorAll(".item").forEach(r => {
    const p = was.get(r.dataset.iid), sel = r.classList.contains("sel");
    if (p === undefined) fade(r);
    else if (sel && !p) fade(r.querySelector(".qty"));
  });
}

let sheetEl = null, shown = null;
function render() {
  const s = step(), was = snap($("app")), sheetWas = sheetEl && snap(sheetEl);
  $("app").innerHTML = s === "checks" ? viewChecks() : viewOrder();
  draw($("app"));
  if (s === shown) play($("app"), was);
  else {
    fade($("app"));
    if (shown === "order" && s === "checks") {
      const ease = { duration: calm.matches ? 0 : 320, easing: "cubic-bezier(.2,.8,.2,1)" };
      $("app").querySelectorAll(".bars i")[1].animate({ transform: ["scaleX(0)", "scaleX(1)"] }, ease);
      $("app").querySelector(".slip").animate({ transform: ["translateY(-18px)", "none"] }, ease);
    }
    shown = s;
  }
  if (sheetEl) {
    const old = sheetEl; sheetEl = null;
    if (ui.sheet) old.remove();
    else { old.classList.add("out"); fadeOut(old, () => old.remove()); }
  }
  if (ui.sheet) {
    const wrap = document.createElement("div"); wrap.innerHTML = sheetHTML();
    sheetEl = wrap.firstElementChild; document.body.appendChild(sheetEl);
    fitScrim();
    draw(sheetEl);
    if (sheetWas) play(sheetEl, sheetWas);
  }
}
/* keep the docked budgets above the on-screen keyboard, which shrinks the visual viewport but not fixed elements */
function fitScrim() {
  const v = window.visualViewport;
  if (!v || !sheetEl || !sheetEl.classList.contains("split")) return;
  sheetEl.style.bottom = "auto"; sheetEl.style.top = v.offsetTop + "px"; sheetEl.style.height = v.height + "px";
  sheetEl.classList.toggle("kb", v.height < document.documentElement.clientHeight - 120);
}
/* update the docked budgets in place so the price field keeps focus */
function refreshLive() {
  const live = $("live"), was = snap(live);
  live.innerHTML = budgets(solve(previewItems()));
  draw(live);
  play(live, was);
}
window.visualViewport?.addEventListener("resize", fitScrim);
window.visualViewport?.addEventListener("scroll", fitScrim);
function openSheet(kind, it) {
  ui.sheet = kind;
  if (kind === "add") { ui.editId = null; ui.draft = { name: "", price: "" }; }
  if (kind === "edit") { ui.editId = it.id; ui.draft = { name: it.name, price: it.price.toFixed(2) }; }
  render();
  fade(sheetEl);
  if (kind === "add") setTimeout(() => $("d-name")?.focus(), 30);
}
function closeSheet() { ui.sheet = null; render(); }
function update() { save(); render(); }
function touched() { S.example = false; }
function nextItemName() {
  let max = 0;
  S.items.forEach(it => { const m = /^Item-(\d+)$/.exec(it.name); if (m) max = Math.max(max, +m[1]); });
  return "Item-" + String(max + 1).padStart(2, "0");
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  if (a === "close" && el.classList.contains("scrim") && e.target !== el) return;
  const pid = el.closest("[data-pid]")?.dataset.pid, p = S.people.find(x => x.id === pid);
  const iid = el.closest("[data-iid]")?.dataset.iid, it = S.items.find(x => x.id === iid);
  switch (a) {
    case "go": go(el.dataset.to); break;
    case "settings": openSheet("settings"); break;
    case "close": closeSheet(); break;
    case "tile": p[el.dataset.kind] = !p[el.dataset.kind]; update(); break;
    case "addp": { const np = { id: uid(), name: "", breakfast: true, lunch: true, dinner: true }; S.people.push(np); update(); $("pn-" + np.id)?.focus(); break; }
    case "rmp": S.people = S.people.filter(x => x !== p); update(); break;
    case "pick": ui.selected = ui.selected === iid ? null : iid; render(); break;
    case "inc": it.qty++; touched(); update(); break;
    case "dec": if (it.qty > 1) it.qty--; else { S.items = S.items.filter(x => x !== it); ui.selected = null; } touched(); update(); break;
    case "additem": openSheet("add"); break;
    case "edit": ui.selected = iid; openSheet("edit", it); break;
    case "deleteitem": S.items = S.items.filter(x => x.id !== ui.editId); ui.selected = null; ui.sheet = null; touched(); update(); break;
    case "additemconfirm": addFromDraft(); break;
    case "donesheet": {
      const n = ui.draft.name.trim() || nextItemName(), pr = num(ui.draft.price);
      if (pr > 0) { S.items.push({ id: uid(), name: n, price: Math.round(pr * 100) / 100, qty: 1 }); touched(); save(); }
      ui.sheet = null; render(); break;
    }
    case "liverate": S.rateMode = "auto"; save(); fetchRate(); break;
    case "split": S.split = el.checked; save(); break;
    case "clear": S.items = []; S.example = false; ui.selected = null; ui.sheet = null; save(); if (step() !== "order") go("order"); else render(); break;
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.act === "pname") { const p = S.people.find(x => x.id === t.closest("[data-pid]").dataset.pid); p.name = t.value; save(); return; }
  if (t.id === "d-name") ui.draft.name = t.value;
  else if (t.id === "d-price") { ui.draft.price = t.value; refreshLive(); }
  else if (t.id === "s-rate") { S.rate = t.value; S.rateMode = "manual"; save(); const n = $("rate-note"); if (n) n.innerHTML = rateNote(); }
  else if (t.id === "s-margin") { S.margin = t.value; save(); }
  else if (t.id && t.id.startsWith("s-cap-")) { S.caps[t.id.slice(6)] = t.value; save(); }
});
document.addEventListener("touchstart", () => {}, { passive: true }); /* iOS only applies :active with a touch listener */
document.addEventListener("submit", e => { e.preventDefault(); if (e.target.id === "addform") addFromDraft(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && ui.sheet) closeSheet(); });
window.addEventListener("hashchange", () => { ui.selected = null; render(); });

function addFromDraft() {
  const price = num(ui.draft.price);
  if (!(price > 0)) { toast("Add a price above $0."); return; }
  const name = ui.draft.name.trim() || (ui.sheet === "edit" ? (S.items.find(x => x.id === ui.editId)?.name || nextItemName()) : nextItemName());
  const existing = ui.sheet === "edit" && S.items.find(x => x.id === ui.editId);
  if (existing) {
    existing.name = name; existing.price = Math.round(price * 100) / 100;
    touched(); ui.selected = existing.id; ui.sheet = null; update(); return;
  }
  const id = uid();
  S.items.push({ id, name, price: Math.round(price * 100) / 100, qty: 1 });
  touched(); ui.selected = id; ui.draft = { name: "", price: "" }; update();
  $("d-name")?.focus();
  toast("Added " + name);
}
/* live CAD→USD rate (works when self-hosted; blocked inside the artifact viewer, so it falls back) */
function rateNote() {
  if (S.rateMode === "manual") return `Using your own rate. <button class="inline" type="button" data-act="liverate">Use live rate</button>`;
  if (S.rateDate) return `Live mid-market rate, updated ${esc(S.rateDate)}.`;
  return `Live rate unavailable, using the ${RATE_DATE} rate. <a href="https://wise.com/ca/currency-converter/cad-to-usd-rate" target="_blank" rel="noopener">Check today's rate ↗</a>`;
}
async function getJSON(url) {
  try { const r = await fetch(url, { cache: "no-store" }); return r.ok ? await r.json() : null; } catch (e) { return null; }
}
async function fetchRate() {
  if (S.rateMode === "manual") return;
  let rate = 0, date = "";
  const a = await getJSON("https://api.frankfurter.dev/v2/rate/cad/usd");
  if (a && a.rate > 0) { rate = a.rate; date = a.date || ""; }
  if (!rate) {
    const b = await getJSON("https://api.frankfurter.dev/v1/latest?base=CAD&symbols=USD");
    if (b && b.rates && b.rates.USD > 0) { rate = b.rates.USD; date = b.date || ""; }
  }
  if (!rate || S.rateMode === "manual") { const n = $("rate-note"); if (n) n.innerHTML = rateNote(); return; }
  S.rate = String(rate); S.rateDate = date || new Date().toISOString().slice(0, 10); save();
  if (ui.sheet === "settings") { const i = $("s-rate"); if (i && document.activeElement !== i) i.value = S.rate; const n = $("rate-note"); if (n) n.innerHTML = rateNote(); }
  else render();
}
function toast(msg) {
  const t = $("toast"); toast.out?.cancel(); clearTimeout(toast.t);
  t.textContent = msg;
  if (t.hidden) { t.hidden = false; fade(t); }
  toast.t = setTimeout(() => { toast.out = fadeOut(t, () => t.hidden = true); }, 1800);
}
/* hold to clear: fill over 1.2s, then reset everything except settings and go to step 1 */
const HOLD_MS = 1200;
const hold = { raf: 0, t0: 0 };
function holdSet(p, animate) {
  const f = $("hold-fill"); if (!f) return;
  f.style.transition = animate ? "width .2s" : "none";
  f.style.width = (p * 100) + "%";
}
function holdStart() {
  if (hold.raf) return;
  hold.t0 = performance.now();
  const tick = now => {
    const p = Math.min(1, (now - hold.t0) / HOLD_MS);
    holdSet(p, false);
    if (p >= 1) { hold.raf = 0; resetAll(); return; }
    hold.raf = requestAnimationFrame(tick);
  };
  hold.raf = requestAnimationFrame(tick);
}
function holdStop() {
  if (!hold.raf) return;
  cancelAnimationFrame(hold.raf); hold.raf = 0; holdSet(0, true);
}
function resetAll() {
  S.people = [{ id: uid(), name: "Me", breakfast: true, lunch: true, dinner: true }];
  S.items = []; S.example = false;
  ui.selected = null; ui.sheet = null;
  save(); go("order"); toast("Cleared");
}
document.addEventListener("pointerdown", e => {
  const b = e.target.closest("#hold"); if (!b) return;
  try { b.setPointerCapture(e.pointerId); } catch (err) {}
  holdStart();
});
["pointerup", "pointercancel"].forEach(t => document.addEventListener(t, holdStop));
document.addEventListener("keydown", e => { if (e.target.id === "hold" && (e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); holdStart(); } });
document.addEventListener("keyup", e => { if (e.target.id === "hold") holdStop(); });
document.addEventListener("contextmenu", e => { if (e.target.closest("#hold")) e.preventDefault(); });

render();
fetchRate();
</script>
